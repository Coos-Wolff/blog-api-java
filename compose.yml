services:
  postgres:
    image: postgres:17
    container_name: blog-api-postgres
    environment:
      POSTGRES_DB: blog_api
      POSTGRES_USER: blog_api
      POSTGRES_PASSWORD: blog_api
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog_api -d blog_api"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
