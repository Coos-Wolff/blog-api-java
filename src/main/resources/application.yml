spring:
  application:
    name: blog-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:blog_api}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: SNAKE_CASE

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized
      # Bare role name, not "ROLE_ADMIN": Spring Security's isUserInRole()
      # implicitly prepends "ROLE_". Using the prefixed form here would
      # silently stop matching anyone.
      roles: ADMIN
      cache:
        time-to-live: 10s

jwt:
  secret: ${JWT_SECRET}
  access-token-ttl: ${JWT_ACCESS_TTL:900s}
  refresh-token-ttl: ${JWT_REFRESH_TTL:7d}
