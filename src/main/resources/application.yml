spring:
  application:
    name: blog-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:blog_api}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: SNAKE_CASE

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized
      # Bare role name, not "ROLE_ADMIN": Spring Security's isUserInRole()
      # implicitly prepends "ROLE_". Using the prefixed form here would
      # silently stop matching anyone.
      roles: ADMIN
      cache:
        time-to-live: 10s
      # Enabled by default on Boot 4.1, set explicitly so intent survives a
      # framework default change. Exposes the "liveness" and "readiness"
      # health groups at /actuator/health/liveness and
      # /actuator/health/readiness for Kubernetes probes. These are
      # sub-paths of the health endpoint, not separate endpoints, so the
      # existing "health" exposure include and the EndpointRequest.to
      # (HealthEndpoint.class) permitAll in SecurityConfig already cover
      # them without any further change.
      probes:
        enabled: true
      group:
        # The default readiness group only aggregates readinessState, which
        # never reflects a lost DB connection - a Kubernetes readinessProbe
        # on the default group would keep routing traffic to a pod that
        # can't serve most of the API. Add "db" so readiness actually goes
        # DOWN (and the pod is pulled from service) when Postgres is
        # unreachable.
        readiness:
          include: readinessState,db

jwt:
  secret: ${JWT_SECRET}
  access-token-ttl: ${JWT_ACCESS_TTL:900s}
  refresh-token-ttl: ${JWT_REFRESH_TTL:7d}
