# Template — copy to secret.yaml (do not commit), fill in real values, then:
#   kubectl apply -n <namespace> -f secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: database-secrets
type: Opaque
stringData:
  # Consumed by the postgres StatefulSet
  POSTGRES_USER: CHANGEME
  POSTGRES_PASSWORD: CHANGEME
  POSTGRES_DB: CHANGEME
  # Consumed by the blog-api-java Deployment
  DB_USERNAME: CHANGEME
  DB_PASSWORD: CHANGEME
  DB_NAME: CHANGEME
  JWT_SECRET: CHANGEME
